name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Export needs FFmpeg 7+ (`-/filter_complex <file>`); distro packages are older,
  # so use a static build from BtbN/FFmpeg-Builds. Bump when this branch is retired.
  FFMPEG_BRANCH: "9.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install FFmpeg ${{ env.FFMPEG_BRANCH }} (Linux)
        if: runner.os == 'Linux'
        run: |
          name="ffmpeg-n${FFMPEG_BRANCH}-latest-linux64-gpl-${FFMPEG_BRANCH}"
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${name}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}/bin" >> "$GITHUB_PATH"

      - name: Install FFmpeg ${{ env.FFMPEG_BRANCH }} (Windows)
        if: runner.os == 'Windows'
        run: |
          name="ffmpeg-n${FFMPEG_BRANCH}-latest-win64-gpl-${FFMPEG_BRANCH}"
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.zip" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${name}.zip"
          unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/${name}/bin" >> "$GITHUB_PATH"

      - name: Check FFmpeg
        run: ffmpeg -hide_banner -version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q -rs --cov=silence_remover --cov-report=term-missing --cov-fail-under=80
